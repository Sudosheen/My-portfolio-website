name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # If GitHub flags an action version as deprecated, bump the major here.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          # Repository secret (Settings > Secrets and variables > Actions). Optional: unset hides the phone row.
          PUBLIC_PHONE_FR_E164: ${{ secrets.PUBLIC_PHONE_FR_E164 }}
      - run: npm run audit:site
      - run: npm run a11y
      # GitHub Pages only serves a redirect from the old address (pages-redirect/) to https://osheenturner.com/.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect
      - uses: actions/upload-artifact@v4
        with:
          name: ovh-dist
          path: dist
          include-hidden-files: true
          retention-days: 7

  # Uploads the production build to OVHcloud by SFTP (encrypted). Skipped until the secrets exist
  # (Settings > Secrets and variables > Actions): OVH_FTP_SERVER, OVH_FTP_USER, OVH_FTP_PASSWORD.
  # Optional repository variable OVH_FTP_DIR (default www/) is the folder the domain points at.
  # Files already on the host are overwritten, never deleted, so nothing else in the folder is lost.
  deploy-ovh:
    needs: build
    runs-on: ubuntu-latest
    env:
      OVH_FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
      OVH_FTP_USER: ${{ secrets.OVH_FTP_USER }}
      OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
      OVH_FTP_DIR: ${{ vars.OVH_FTP_DIR || 'www/' }}
    steps:
      - if: env.OVH_FTP_SERVER != ''
        uses: actions/download-artifact@v4
        with:
          name: ovh-dist
          path: ovh-dist
      - if: env.OVH_FTP_SERVER != ''
        run: |
          sudo apt-get install -y --no-install-recommends lftp
          lftp -e "set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 20; mirror -R --parallel=3 --verbose ovh-dist/ \"$OVH_FTP_DIR\"; bye" \
            -u "$OVH_FTP_USER","$OVH_FTP_PASSWORD" "sftp://$OVH_FTP_SERVER"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
